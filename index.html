async function hashPassword(p,salt){
 const data=new TextEncoder().encode(String(salt)+'::'+String(p));
 if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
 // Fallback hanya agar demo file lokal tetap bisa diperiksa di browser lama; bukan untuk produksi.
 let h1=0x811c9dc5,h2=0x01000193;for(const b of data){h1^=b;h1=Math.imul(h1,0x01000193);h2=Math.imul(h2^b,0x5bd1e995);}return (h1>>>0).toString(16)+(h2>>>0).toString(16).repeat(4);
}

 return `<div class="page"><section class="hero"><div class="eyebrow">${isAdmin()?'PUSAT KONTROL':isTeacher()?'RUANG PENGAJAR':'RUANG BELAJAR'} · ${fmt(now(),{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><h2>Halo, ${esc(u.name.split(' ')[0])}! ${isStudent()?'Siap belajar hal baru hari ini?':'Selamat datang di GoLearnMS.'}</h2><p>${intro}</p><div class="hero-meta"><span>✦ Terus bertumbuh</span><span>◷ ${isAdmin()?'Pantau aktivitas':isTeacher()?'Kelola pembelajaran':'Pantau perkembangan'}</span><span>⌁ Ruang belajar digital</span></div></section><section class="grid grid-4">${stats}</section><section class="grid grid-2"><div class="panel panel-pad"><div class="section-head"><div><h2 class="h2">${isAdmin()?'Aktivitas terbaru':isTeacher()?'Agenda pembelajaran':'Langkah berikutnya'}</h2><p>${isAdmin()?'Log yang tercatat pada lingkungan ini':isTeacher()?'Ringkasan pengelolaan kelas':'Rekomendasi aktivitas Anda'}</p></div><button class="btn btn-soft btn-sm" data-route="${isAdmin()?'reports':isTeacher()?'classes':'classes'}">${isAdmin()?'Lihat laporan':'Buka kelas'} →</button></div>${extra}</div><div class="panel panel-pad"><div class="section-head"><div><h2 class="h2">Akses cepat</h2><p>Langsung menuju fitur yang sering digunakan</p></div></div><div class="grid grid-2">${(isAdmin()?[['Data Pengguna','users','♙'],['Laporan Kunjungan','reports','▥'],['Asisten AI','assistant','✧'],['Maintenance','maintenance','⚙']]:[['Kelas','classes','▦'],['Presensi','attendance','✓'],['Asisten AI','assistant','✧'],['Pengaturan','settings','⚙']]).map(([label,r,ic])=>`<button class="panel" data-route="${r}" style="border:1px solid var(--line);padding:17px;text-align:left;cursor:pointer"><div style="font-size:22px;margin-bottom:12px">${ic}</div><div style="font-size:12px;font-weight:800">${label}</div><div class="small muted" style="margin-top:5px">Buka fitur →</div></button>`).join('')}</div><div class="divider"></div><div class="notice"><b>Catatan demo:</b> data disimpan di browser lokal. Jangan masukkan data pribadi atau data siswa yang sesungguhnya.</div></div></section></div>`}
function renderRecentActivity(){const visits=[...db.visits].sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp)).slice(0,5);if(!visits.length)return `<div class="empty">Belum ada kunjungan.</div>`;return visits.map(v=>{const u=getUser(v.userId);return `<div class="activity"><div class="activity-icon">↗</div><div><strong style="font-size:12px">${esc(u?.name||'Pengguna tidak ditemukan')}</strong><p>${esc(v.action||'Kunjungan')} · ${fmt(v.timestamp,{dateStyle:'medium',timeStyle:'short'})} <span class="badge gray">${esc(roleLabel(v.role))}</span></p></div></div>`}).join('')}
function renderTeacherUpcoming(classes){if(!classes.length)return `<div class="empty"><div class="big">▦</div><b>Belum ada kelas</b><p>Buat kelas pertama Anda untuk mulai mengunggah materi dan memberikan tugas.</p><button class="btn btn-primary" data-action="modal-create-class">+ Buat kelas</button></div>`;return classes.slice(0,4).map(c=>`<div class="list-line"><div class="activity-icon">▦</div><div class="grow"><strong>${esc(c.name)}</strong><p>${c.members.length} siswa · ${c.assignments.length} tugas · kode <span class="class-code">${esc(c.code)}</span></p></div><button class="btn btn-soft btn-sm" data-action="open-class" data-id="${c.id}">Buka</button></div>`).join('')}
function renderStudentUpcoming(tasks){if(!tasks.length)return `<div class="empty"><div class="big">🎉</div><b>Semua tugas sudah terkumpul!</b><p>Terus ikuti sesi pembelajaran dan periksa umpan balik dari guru.</p><button class="btn btn-primary" data-route="classes">Lihat kelas saya</button></div>`;return tasks.slice(0,5).map(({c,a})=>`<div class="list-line"><div class="activity-icon">✎</div><div class="grow"><strong>${esc(a.title)}</strong><p>${esc(c.name)} · Deadline ${fmt(a.deadline,{dateStyle:'medium',timeStyle:'short'})}</p></div><button class="btn btn-soft btn-sm" data-action="open-class" data-id="${c.id}" data-tab="tasks">Kerjakan</button></div>`).join('')}
function renderUsers(){const filtered=db.users.filter(u=>(!searchUsers||[u.name,u.username,u.email,u.institution].some(x=>norm(x).includes(norm(searchUsers))))&&(statusFilter==='all'||(statusFilter==='blocked'?u.blocked:!u.blocked&&statusFor(u).label.toLowerCase()===statusFilter)));return `<div class="page"><div class="section-head"><div><h1 class="content-title">Data Pengguna</h1><p class="content-subtitle">Kelola akun, peran, dan status pengguna yang terdaftar.</p></div><div class="row"><button class="btn" data-action="export-users">↓ CSV</button><button class="btn" data-action="export-users-xlsx">↓ Excel</button><button class="btn" data-action="print">Cetak / PDF</button><button class="btn btn-primary" data-action="modal-add-user">+ Tambah pengguna</button></div></div><div class="notice warn">Data demo ditandai dengan label DEMO. Password dan hash password tidak ditampilkan atau disertakan dalam ekspor. Hak admin hanya dapat diberikan oleh superadmin.</div><div class="grid grid-4">${statCard('Total akun',db.users.length,'♙','#eee8ff')}${statCard('Akun aktif',db.users.filter(u=>!u.blocked&&statusFor(u).label==='Aktif').length,'✓','#def7eb')}${statCard('Akun diblokir',db.users.filter(u=>u.blocked).length,'⊘','#ffe6ec')}${statCard('Admin',db.users.filter(u=>u.roles.includes('admin')).length,'⚙','#fff1d6')}</div><section class="panel"><div class="panel-pad"><div class="section-head"><div><h2 class="h2">Daftar akun</h2><p>${filtered.length} pengguna ditemukan</p></div><div class="row wrap"><div class="search"><input id="user-search" value="${esc(searchUsers)}" placeholder="Cari nama, username…"></div><select id="status-filter" class="top-select"><option value="all" ${statusFilter==='all'?'selected':''}>Semua status</option><option value="aktif" ${statusFilter==='aktif'?'selected':''}>Aktif</option><option value="tidak aktif" ${statusFilter==='tidak aktif'?'selected':''}>Tidak aktif</option><option value="blocked" ${statusFilter==='blocked'?'selected':''}>Diblokir</option></select><label class="btn btn-sm" for="users-import">↑ Impor CSV</label><input id="users-import" type="file" accept=".csv,text/csv" class="hidden"></div></div></div><div class="table-wrap"><table><thead><tr><th>Pengguna</th><th>Peran</th><th>Instansi</th><th>Status</th><th>Registrasi</th><th>Login terakhir</th><th>Aksi</th></tr></thead><tbody>${filtered.map(u=>{const st=statusFor(u);return `<tr><td><div class="usercell">${avatar(u,'sm')}<div><strong>${esc(u.name)}</strong><span>@${esc(u.username)} · ${esc(u.email)}</span></div></div></td><td><div class="row wrap">${u.roles.map(r=>`<span class="badge ${r==='admin'?'gold':r==='guru'?'blue':'gray'}">${roleLabel(r)}</span>`).join(' ')}${u.isSuperAdmin?'<span class="badge">Superadmin</span>':''}</div></td><td>${esc(u.institution||'—')}</td><td><span class="badge ${st.cls}">${st.label}</span></td><td>${fmt(u.createdAt)}</td><td>${fmt(u.lastLogin,{dateStyle:'short',timeStyle:'short'})}</td><td><div class="row wrap"><button class="btn btn-sm" data-action="view-user" data-id="${u.id}">Detail</button>${canSuper()&&!u.isSuperAdmin?`<button class="btn btn-sm btn-soft" data-action="toggle-admin" data-id="${u.id}">${u.roles.includes('admin')?'Cabut admin':'Jadikan admin'}</button>`:''}${canSuper()&&!u.isSuperAdmin?`<button class="btn btn-sm ${u.blocked?'btn-success':'btn-danger'}" data-action="toggle-block" data-id="${u.id}">${u.blocked?'Pulihkan':'Blokir'}</button>`:''}</div></td></tr>`}).join('')||`<tr><td colspan="7"><div class="empty">Tidak ada pengguna yang cocok.</div></td></tr>`}</tbody></table></div><div class="panel-pad small muted">Catatan: status online mengikuti aktivitas pada sesi demo yang sedang berjalan; status operasional lainnya dihitung dari riwayat login.</div></section></div>`}
function periodStart(period){const d=new Date();if(period==='day')d.setHours(0,0,0,0);else if(period==='week')d.setDate(d.getDate()-6);else if(period==='month')d.setMonth(d.getMonth()-1);else if(period==='quarter')d.setMonth(d.getMonth()-3);else if(period==='year')d.setFullYear(d.getFullYear()-1);else return new Date(0);return d}
function reportData(){const start=periodStart(reportPeriod);return db.visits.filter(v=>new Date(v.timestamp)>=start&&(reportRole==='all'||v.role===reportRole));}
function groupVisits(vs){const groups={};let labels=[];const period=reportPeriod;if(period==='day'){for(let i=0;i<24;i++)labels.push(`${String(i).padStart(2,'0')}:00`);vs.forEach(v=>{const h=new Date(v.timestamp).getHours();groups[labels[h]]=(groups[labels[h]]||0)+1;});}else if(period==='quarter'){const key=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x.toISOString().slice(0,10)};const keyToLabel={};for(let i=12;i>=0;i--){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7)-i*7);const k=key(d),label=d.toLocaleDateString('id-ID',{day:'2-digit',month:'short'});labels.push(label);keyToLabel[k]=label;groups[label]=0;}vs.forEach(v=>{const label=keyToLabel[key(v.timestamp)];if(label)groups[label]=(groups[label]||0)+1;});}else{const n=period==='week'?7:period==='month'?30:period==='year'?12:10;for(let i=n-1;i>=0;i--){const d=new Date();if(period==='year')d.setMonth(d.getMonth()-i);else d.setDate(d.getDate()-i);const k=period==='year'?d.toLocaleDateString('id-ID',{month:'short'}):d.toLocaleDateString('id-ID',{day:'2-digit',month:'short'});if(!labels.includes(k))labels.push(k);}vs.forEach(v=>{const d=new Date(v.timestamp);const k=period==='year'?d.toLocaleDateString('id-ID',{month:'short'}):d.toLocaleDateString('id-ID',{day:'2-digit',month:'short'});groups[k]=(groups[k]||0)+1;});}
 return labels.map(label=>({label,value:groups[label]||0}));}
function renderChart(data){const max=Math.max(1,...data.map(x=>x.value));const every=data.length>15?Math.ceil(data.length/10):1;return `<div class="chart">${data.map((x,i)=>`<div class="chart-col"><span class="chart-num">${x.value||''}</span><div class="chart-bar" style="height:${Math.max(x.value?4:1,x.value/max*74)}%;opacity:${x.value?1:.25}" title="${esc(x.label)}: ${x.value} kunjungan"></div><span class="chart-label">${i%every===0||i===data.length-1?esc(x.label):' '}</span></div>`).join('')}</div>`}
function renderReports(){const visits=reportData(),users=new Set(visits.map(v=>v.userId)).size,active=db.users.filter(u=>!u.blocked&&u.lastLogin&&new Date(u.lastLogin)>=periodStart(reportPeriod)).length,series=groupVisits(visits),byRole=['guru','siswa'].map(r=>({r,count:visits.filter(v=>v.role===r).length}));const peak=[...series].sort((a,b)=>b.value-a.value)[0];let analysis='Data belum cukup untuk menyimpulkan pola kunjungan.';if(visits.length){analysis=`Tercatat ${visits.length} kunjungan dari ${users} pengguna unik pada periode yang dipilih. `;if(peak&&peak.value>0)analysis+=`Periode dengan kunjungan terbanyak pada grafik adalah ${peak.label} (${peak.value} kunjungan). `;if(byRole[0].count+byRole[1].count)analysis+=`Kunjungan guru ${byRole[0].count} dan siswa ${byRole[1].count}.`;}
 return `<div class="page"><div class="section-head"><div><h1 class="content-title">Laporan Kunjungan</h1><p class="content-subtitle">Analitik kunjungan dari catatan aktivitas yang tersimpan pada demo ini.</p></div><div class="row"><button class="btn" data-action="export-report">↓ CSV</button><button class="btn" data-action="export-report-xlsx">↓ Excel</button><button class="btn btn-primary" data-action="print">Cetak / PDF</button></div></div><div class="notice warn">Di demo lokal, data kunjungan berasal dari log demo dan aktivitas browser ini. Laporan produksi perlu event logging server-side agar lebih andal.</div><div class="panel panel-pad"><div class="section-head"><div><h2 class="h2">Filter laporan</h2><p>Pilih periode dan kategori untuk memperbarui visualisasi.</p></div></div><div class="row wrap"><div class="field" style="min-width:190px"><label>Rentang waktu</label><select id="report-period"><option value="day" ${reportPeriod==='day'?'selected':''}>Hari ini</option><option value="week" ${reportPeriod==='week'?'selected':''}>7 hari terakhir</option><option value="month" ${reportPeriod==='month'?'selected':''}>1 bulan terakhir</option><option value="quarter" ${reportPeriod==='quarter'?'selected':''}>3 bulan terakhir</option><option value="year" ${reportPeriod==='year'?'selected':''}>1 tahun terakhir</option><option value="all" ${reportPeriod==='all'?'selected':''}>Seluruh periode</option></select></div><div class="field" style="min-width:190px"><label>Kategori pengguna</label><select id="report-role"><option value="all" ${reportRole==='all'?'selected':''}>Semua guru & siswa</option><option value="guru" ${reportRole==='guru'?'selected':''}>Guru</option><option value="siswa" ${reportRole==='siswa'?'selected':''}>Siswa</option></select></div><div style="align-self:flex-end"><span class="badge blue">Dibuat ${fmt(now())}</span></div></div></div><div class="grid grid-3">${statCard('Total kunjungan',visits.length,'↗','#eee8ff','Satu catatan per aktivitas tercatat')}${statCard('Pengguna unik',users,'♙','#e3efff','Username unik dalam periode')}${statCard('Pengguna login aktif',active,'✓','#ddf7ed','Akun login dalam periode terpilih')}</div><div class="panel panel-pad"><div class="section-head"><div><h2 class="h2">Tren kunjungan</h2><p>Jumlah kunjungan per interval waktu</p></div><span class="badge">${visits.length} catatan</span></div>${renderChart(series)}</div><div class="grid grid-2"><div class="panel panel-pad"><h2 class="h2">Aktivitas menurut peran</h2><p class="subhead">Perbandingan jumlah kunjungan pada periode ini.</p><div class="stack" style="margin-top:20px">${byRole.map(({r,count})=>`<div><div class="row between" style="margin-bottom:7px"><span>${roleLabel(r)}</span><strong>${count}</strong></div><div class="progress"><span style="width:${visits.length?count/visits.length*100:0}%;background:${r==='guru'?'linear-gradient(90deg,#4b8df8,#82bbff)':'linear-gradient(90deg,#7258df,#b6a5ff)'}"></span></div></div>`).join('')}</div></div><div class="panel panel-pad"><div class="row" style="align-items:flex-start"><div class="activity-icon">✦</div><div><h2 class="h2">Interpretasi otomatis</h2><p class="subhead" style="line-height:1.8">${esc(analysis)}</p><div class="small muted" style="margin-top:13px">Interpretasi hanya memakai data yang terlihat di atas. Ini bukan prediksi dan tidak menggantikan pemeriksaan admin.</div></div></div></div></div><section class="panel"><div class="panel-pad"><div class="section-head"><div><h2 class="h2">Rincian kunjungan</h2><p>Timestamp dan kategori untuk audit sederhana.</p></div></div></div><div class="table-wrap"><table><thead><tr><th>Waktu</th><th>Pengguna</th><th>Peran</th><th>Aktivitas</th></tr></thead><tbody>${[...visits].sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp)).slice(0,100).map(v=>`<tr><td>${fmt(v.timestamp,{dateStyle:'medium',timeStyle:'short'})}</td><td>${esc(getUser(v.userId)?.username||'—')}</td><td>${roleLabel(v.role)}</td><td>${esc(v.action||'Kunjungan')}</td></tr>`).join('')||'<tr><td colspan="4"><div class="empty">Tidak ada data kunjungan pada periode ini.</div></td></tr>'}</tbody></table></div></section></div>`}
function renderMaintenance(){const allSubs=db.classes.flatMap(c=>c.assignments.flatMap(a=>a.submissions.map(s=>({c,a,s}))));const logs=[...db.logs].sort((a,b)=>new Date(b.time)-new Date(a.time));const boards=db.classes.map(c=>({c,rows:leaderboard(c)}));return `<div class="page"><div class="section-head"><div><h1 class="content-title">Maintenance</h1><p class="content-subtitle">Pusat pemantauan data pembelajaran, catatan sistem, dan leaderboard lintas kelas.</p></div><div class="row"><button class="btn" data-action="export-maintenance">↓ CSV</button><button class="btn" data-action="export-maintenance-xlsx">↓ Excel</button><button class="btn btn-primary" data-action="print">Cetak / PDF</button></div></div><div class="notice warn">Halaman ini adalah dashboard pemantauan demo lokal. Status atau presensi yang tampil di sini tidak dapat diedit admin melalui menu pemantauan.</div><div class="grid grid-4">${statCard('Kelas terpantau',db.classes.length,'▦','#eee8ff')}${statCard('Sesi pembelajaran',db.classes.reduce((n,c)=>n+c.sessions.length,0),'▤','#e5efff')}${statCard('Pengumpulan tugas',allSubs.length,'✎','#fff0d3')}${statCard('Log sistem',logs.length,'⚙','#def7eb')}</div><div class="grid grid-2"><section class="panel"><div class="panel-pad"><div class="section-head"><div><h2 class="h2">Konten pembelajaran</h2><p>Ringkasan struktur kelas dan materi.</p></div><span class="badge blue">Monitoring</span></div>${db.classes.map(c=>`<div class="list-line"><div class="activity-icon">▦</div><div class="grow"><strong>${esc(c.name)}</strong><p>${c.members.length} peserta · ${c.sessions.length} sesi · ${c.assignments.length} tugas · ${c.meetings.length} pertemuan presensi</p></div><button class="btn btn-sm" data-action="view-admin-class" data-id="${c.id}">Lihat</button></div>`).join('')||'<div class="empty">Belum ada kelas.</div>'}</div></section><section class="panel"><div class="panel-pad"><div class="section-head"><div><h2 class="h2">Log error & anomali</h2><p>Rahasiakan token dan data kredensial dalam log.</p></div></div><div class="stack">${logs.slice(0,8).map(l=>`<div class="list-line" style="align-items:flex-start"><div class="activity-icon" style="background:${l.type==='error'?'#fff0f3':'#f1edff'};color:${l.type==='error'?'var(--red)':'var(--purple)'}">${l.type==='error'?'!':'·'}</div><div class="grow"><div class="row wrap"><strong>${esc(l.module)}</strong><span class="badge ${l.status==='selesai'?'green':l.status==='ditangani'?'gold':'gray'}">${esc(l.status||'baru')}</span></div><p>${esc(l.message)}<br>${fmt(l.time,{dateStyle:'medium',timeStyle:'short'})}</p><div class="row wrap" style="margin-top:7px">${l.status!=='ditangani'&&l.status!=='selesai'?`<button class="btn btn-sm" data-action="log-status" data-id="${l.id}" data-status="ditangani">Tandai ditangani</button>`:''}${l.status!=='selesai'?`<button class="btn btn-sm btn-soft" data-action="log-status" data-id="${l.id}" data-status="selesai">Selesaikan</button>`:''}</div></div></div>`).join('')||'<div class="empty">Belum ada log.</div>'}</div></div></section></div><section class="panel"><div class="panel-pad"><div class="section-head"><div><h2 class="h2">Leaderboard keseluruhan</h2><p>Hanya ditampilkan di Maintenance admin. Skor dihitung ulang dari nilai tugas dan poin kecepatan.</p></div></div><div class="stack">${boards.map(({c,rows})=>`<div class="panel panel-pad" style="box-shadow:none"><div class="row between"><div><h3 class="h3">${esc(c.name)}</h3><div class="small muted" style="margin-top:5px">${rows.length} peserta · kode ${esc(c.code)}</div></div><span class="badge gold">${rows.length?'Peringkat dihitung':'Belum ada data'}</span></div><div class="table-wrap" style="margin-top:10px"><table><thead><tr><th>Rank</th><th>Nama siswa</th><th>Nilai rata-rata</th><th>Poin kecepatan</th><th>Skor akhir</th></tr></thead><tbody>${rows.slice(0,10).map((r,i)=>`<tr><td><span class="rank-num ${i===0?'gold':i===1?'silver':i===2?'bronze':''}">${i+1}</span></td><td>${esc(r.user?.name||'Pengguna tidak ditemukan')}</td><td>${r.avgScore==null?'—':r.avgScore.toFixed(1)}</td><td>${r.avgSpeed==null?'—':r.avgSpeed.toFixed(1)}</td><td><strong>${r.finalScore.toFixed(1)}</strong></td></tr>`).join('')||'<tr><td colspan="5">Belum ada peserta.</td></tr>'}</tbody></table></div></div>`).join('')}</div></div></section><section class="panel"><div class="panel-pad"><div class="section-head"><div><h2 class="h2">Pemantauan presensi seluruh kelas</h2><p>Mode baca-saja untuk admin. Ekspor tidak mencakup perubahan status.</p></div><button class="btn" data-action="export-all-attendance">↓ CSV presensi</button><button class="btn" data-action="export-all-attendance-xlsx">↓ Excel presensi</button></div><div class="table-wrap"><table><thead><tr><th>Kelas</th><th>Pertemuan</th><th>Tanggal</th><th>Peserta tercatat</th><th>Status hadir</th></tr></thead><tbody>${db.classes.flatMap(c=>c.meetings.map(m=>{const rec=Object.values(m.records||{});return `<tr><td>${esc(c.name)}</td><td>${esc(m.title)}</td><td>${fmt(m.date)}</td><td>${rec.length}</td><td>${rec.filter(r=>r.status==='Hadir').length} hadir · ${rec.filter(r=>r.status==='Tidak Hadir').length} tidak hadir · ${rec.filter(r=>r.status==='Izin').length} izin · ${rec.filter(r=>r.status==='Sakit').length} sakit</td></tr>`})).join('')||'<tr><td colspan="5"><div class="empty">Belum ada catatan presensi.</div></td></tr>'}</tbody></table></div></div></section></div>`}
function teacherClasses(){return db.classes.filter(c=>c.teacherId===currentUserId)}function studentClasses(){return db.classes.filter(c=>c.members.some(m=>m.userId===currentUserId))}
function renderClasses(){const list=isTeacher()?teacherClasses():studentClasses();return `<div class="page"><div class="section-head"><div><h1 class="content-title">${isTeacher()?'Kelas yang Saya Kelola':'Kelas Saya'}</h1><p class="content-subtitle">${isTeacher()?'Buat kelas, bagikan kode, susun materi, dan kelola tugas.':'Akses materi, kumpulkan tugas, dan pantau perkembangan belajar.'}</p></div>${isTeacher()?`<button class="btn btn-primary" data-action="modal-create-class">+ Buat kelas</button>`:`<button class="btn btn-primary" data-action="modal-join-class">+ Gabung kelas</button>`}</div>${isStudent()?`<section class="panel panel-pad"><div class="section-head"><div><h2 class="h2">Gabung dengan kode kelas</h2><p>Minta kode masuk kepada guru Anda.</p></div></div><form id="join-class-form" class="row wrap"><div class="field" style="flex:1;min-width:220px;margin:0"><input name="code" required placeholder="Contoh: AKUN-1234" autocomplete="off" aria-label="Kode masuk kelas"></div><button class="btn btn-primary" type="submit">Gabung kelas</button></form></section>`:''}<section class="grid grid-3">${list.map((c,i)=>renderClassCard(c,i)).join('')||`<div class="panel empty" style="grid-column:1/-1"><div class="big">▦</div><b>${isTeacher()?'Belum ada kelas yang dibuat':'Anda belum mengikuti kelas'}</b><p>${isTeacher()?'Buat kelas pertama Anda untuk memulai.':'Gunakan kode masuk dari guru untuk bergabung.'}</p><button class="btn btn-primary" data-action="${isTeacher()?'modal-create-class':'modal-join-class'}">${isTeacher()?'+ Buat kelas':'+ Gabung kelas'}</button></div>`}</section>${isStudent()?`<section class="panel panel-pad"><div class="section-head"><div><h2 class="h2">Kelas yang tersedia</h2><p>Kelas demo dan kelas yang masih menerima peserta.</p></div></div><div class="grid grid-3">${db.classes.filter(c=>c.open&&!c.members.some(m=>m.userId===currentUserId)).map((c,i)=>renderClassCard(c,i,true)).join('')||'<p class="muted small">Tidak ada kelas lain yang tersedia saat ini.</p>'}</div></section>`:''}</div>`}
function renderClassCard(c,i,joinable=false){const teacher=getUser(c.teacherId);const n=c.members.length;return `<article class="panel class-card"><div class="class-cover ${['','blue','gold','green'][i%4]}"></div><div class="row between" style="align-items:flex-start"><div style="min-width:0"><h3 class="h3">${esc(c.name)}</h3><p class="small muted" style="line-height:1.6;margin:7px 0 0">${esc(c.description||'Tidak ada deskripsi.')}</p></div><span class="badge ${c.open?'green':'gray'}">${c.open?'Aktif':'Ditutup'}</span></div><div class="row wrap" style="margin-top:14px;gap:7px"><span class="badge gray">♙ ${n} siswa</span><span class="badge gray">▤ ${c.sessions.length} sesi</span><span class="badge gray">✓ ${c.assignments.length} tugas</span></div><div class="divider" style="margin:14px 0"></div><div class="row between"><div class="row" style="gap:8px">${avatar(teacher,'sm')}<div><div class="small" style="font-weight:750">${esc(teacher?.name||'Guru')}</div><div class="small muted">${esc(teacher?.institution||'')}</div></div></div><span class="class-code">${esc(c.code)}</span></div><div class="row" style="margin-top:15px">${joinable?`<button class="btn btn-primary" style="width:100%" data-action="use-class-code" data-code="${esc(c.code)}">Isi kode untuk gabung →</button>`:`<button class="btn btn-primary" style="flex:1" data-action="open-class" data-id="${c.id}">Buka kelas →</button>`}${isTeacher()?`<button class="btn" title="Edit kelas" data-action="edit-class" data-id="${c.id}">✎</button>`:''}</div></article>`}
function classAllowed(c){return !!c&&(isAdmin()||((isTeacher()&&c.teacherId===currentUserId)||(isStudent()&&c.members.some(m=>m.userId===currentUserId))));}
function renderClassDetail(){const c=getClass();if(!classAllowed(c))return `<div class="page"><button class="btn" data-route="classes">← Kembali ke kelas</button>${denied()}</div>`;const teacher=getUser(c.teacherId);const tabs=[['overview','Ringkasan'],['sessions','Materi & sesi'],['tasks','Penugasan'],['participants','Peserta'],['leaderboard','Leaderboard']];const tabButtons=tabs.map(([id,label])=>`<button class="${classTab===id?'active':''}" data-action="class-tab" data-tab="${id}">${label}</button>`).join('');let inner='';if(classTab==='overview')inner=renderClassOverview(c);if(classTab==='sessions')inner=renderSessions(c);if(classTab==='tasks')inner=renderTasks(c);if(classTab==='participants')inner=renderParticipants(c);if(classTab==='leaderboard')inner=renderLeaderboard(c);return `<div class="page"><div class="row between wrap"><button class="btn" data-route="classes">← Semua kelas</button><div class="row wrap">${isTeacher()?`<button class="btn" data-action="edit-class" data-id="${c.id}">✎ Edit kelas</button><button class="btn btn-primary" data-action="copy-code" data-code="${esc(c.code)}">Kode kelas: ${esc(c.code)} ⧉</button>`:`<span class="badge blue">Kelas · ${esc(c.code)}</span>`}</div></div><section class="hero"><div class="eyebrow">${esc(teacher?.name||'Guru')} · ${c.members.length} PESERTA</div><h2>${esc(c.name)}</h2><p>${esc(c.description||'Belum ada deskripsi kelas.')}</p><div class="hero-meta"><span>▤ ${c.sessions.length} sesi</span><span>✎ ${c.assignments.length} tugas</span><span>✓ ${c.meetings.length} pertemuan</span></div></section><div class="pill-tabs">${tabButtons}</div>${inner}</div>`}
function renderClassOverview(c){const submissions=c.assignments.flatMap(a=>a.submissions);const ungraded=submissions.filter(s=>s.score==null).length;const due=c.assignments.filter(a=>new Date(a.deadline)>new Date()).length;return `<section class="grid grid-3">${statCard('Peserta kelas',c.members.length,'♙','#eee8ff')}${statCard(isTeacher()?'Belum dinilai':'Tugas aktif',isTeacher()?ungraded:due,'✎','#fff0d3')}${statCard('Sesi pembelajaran',c.sessions.length,'▤','#e5efff')}</section><div class="grid grid-2"><div class="panel panel-pad"><div class="section-head"><div><h2 class="h2">Aktivitas kelas</h2><p>Ringkasan pembelajaran dan penilaian.</p></div></div><div class="list-line"><div class="activity-icon">▤</div><div class="grow"><strong>Sesi pembelajaran</strong><p>${c.sessions.length} sesi tersedia</p></div><button class="btn btn-sm" data-action="class-tab" data-tab="sessions">Buka</button></div><div class="list-line"><div class="activity-icon">✎</div><div class="grow"><strong>Penugasan</strong><p>${c.assignments.length} tugas · ${submissions.length} pengumpulan</p></div><button class="btn btn-sm" data-action="class-tab" data-tab="tasks">Buka</button></div><div class="list-line"><div class="activity-icon">✓</div><div class="grow"><strong>Presensi</strong><p>${c.meetings.length} pertemuan dibuat</p></div><button class="btn btn-sm" data-route="attendance" data-id="${c.id}">Buka</button></div></div><div class="panel panel-pad"><div class="section-head"><div><h2 class="h2">${isTeacher()?'Aksi pengajar':'Ringkasan hasil belajar'}</h2><p>${isTeacher()?'Pintasan yang sering digunakan':'Pantau pengerjaan Anda.'}</p></div></div>${isTeacher()?`<div class="stack"><button class="btn btn-soft" data-action="modal-create-session" data-id="${c.id}">+ Tambah sesi pembelajaran</button><button class="btn btn-soft" data-action="modal-create-task" data-id="${c.id}">+ Buat penugasan</button><button class="btn btn-soft" data-route="attendance" data-id="${c.id}">✓ Kelola presensi</button><button class="btn btn-soft" data-action="class-tab" data-tab="leaderboard">♜ Lihat leaderboard kelas</button></div>`:`<div class="notice">Nilai, umpan balik, dan status tugas tampil setelah guru menyelesaikan penilaian. Poin kecepatan dihitung dari waktu submit yang tersimpan.</div><div style="margin-top:16px"><button class="btn btn-primary" data-action="class-tab" data-tab="tasks">Lihat penugasan →</button></div>`}</div></div>`}
function renderSessions(c){return `<div class="page"><div class="section-head"><div><h2 class="h2">Materi dan sesi pembelajaran</h2><p>Materi eksternal dan file lokal kecil dapat dibuka melalui tautan di bawah.</p></div>${isTeacher()?`<button class="btn btn-primary" data-action="modal-create-session" data-id="${c.id}">+ Tambah sesi</button>`:''}</div>${isTeacher()?`<section class="panel panel-pad"><h3 class="h3">Tambah materi ke sesi</h3><form id="add-material-form" data-class-id="${c.id}" style="margin-top:14px"><div class="form-grid"><div class="field"><label>Sesi tujuan</label><select name="sessionId" required>${c.sessions.map(s=>`<option value="${s.id}">${esc(s.title)}</option>`).join('')}</select></div><div class="field"><label>Nama materi</label><input name="title" required maxlength="150" placeholder="Contoh: Modul persediaan"></div><div class="field full"><label>URL (opsional)</label><input name="url" type="url" placeholder="https://…"><span class="small muted">Gunakan tautan HTTPS tepercaya atau unggah file kecil untuk demo lokal.</span></div><div class="field full"><label>Atau pilih file (maks. 1 MB pada demo)</label><input name="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.txt,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.mp4,.webm"></div></div><div class="form-actions"><button class="btn btn-primary" type="submit">Simpan materi</button></div></form></section>`:''}<div class="stack">${c.sessions.map((s,i)=>`<section class="panel panel-pad"><div class="row between wrap"><div class="row" style="align-items:flex-start"><div class="rank-num">${i+1}</div><div><h3 class="h3">${esc(s.title)}</h3><p class="small muted" style="margin:6px 0 0">${fmt(s.date,{dateStyle:'medium'})} · ${esc(s.description||'')}</p></div></div>${isTeacher()?`<button class="btn btn-sm btn-danger" data-action="delete-session" data-id="${s.id}" data-class-id="${c.id}">Hapus sesi</button>`:''}</div><div class="divider"></div>${s.materials.length?s.materials.map(m=>`<div class="list-line"><div class="activity-icon">${m.type==='file'?'▧':'↗'}</div><div class="grow"><strong>${esc(m.title)}</strong><p>${m.type==='file'?`${esc(m.fileName||'File')} · ${formatBytes(m.size||0)}`:esc(m.url)}</p></div>${m.type==='file'?`<a class="btn btn-sm" href="${m.dataUrl}" download="${esc(m.fileName||m.title)}">Unduh</a>`:`<a class="btn btn-sm" href="${esc(m.url)}" rel="noopener noreferrer" target="_blank">Buka tautan ↗</a>`}${isTeacher()?`<button class="btn btn-sm btn-danger" data-action="delete-material" data-id="${m.id}" data-class-id="${c.id}" data-session-id="${s.id}">×</button>`:''}</div>`).join(''):`<div class="empty" style="padding:18px">Belum ada materi pada sesi ini.</div>`}</section>`).join('')||`<div class="panel empty"><div class="big">▤</div><b>Belum ada sesi</b><p>${isTeacher()?'Tambahkan sesi untuk mulai membagikan pembelajaran.':'Guru belum menambahkan sesi pembelajaran.'}</p></div>`}</div></div>`}
function isLate(sub,task){return !!(sub?.submittedAt&&task?.deadline&&new Date(sub.submittedAt)>new Date(task.deadline))}
function renderTasks(c){return `<div class="page"><div class="section-head"><div><h2 class="h2">Daftar penugasan</h2><p>${isTeacher()?'Tinjau pengumpulan siswa, berikan nilai 0–100, dan tuliskan umpan balik.':'Kerjakan tugas dan periksa status penilaian.'}</p></div>${isTeacher()?`<button class="btn btn-primary" data-action="modal-create-task" data-id="${c.id}">+ Buat tugas</button>`:''}</div>${c.assignments.map(a=>{const subs=a.submissions||[];const mine=subs.find(s=>s.userId===currentUserId);const pending=Date.now()>new Date(a.deadline).getTime();return `<section class="panel panel-pad"><div class="row between wrap"><div style="min-width:0"><div class="row wrap"><h3 class="h3">${esc(a.title)}</h3><span class="badge ${pending?'gold':'green'}">${pending?'Deadline lewat':'Berjalan'}</span></div><p class="small muted" style="margin:7px 0 0">Deadline: ${fmt(a.deadline,{dateStyle:'medium',timeStyle:'short'})}${a.sessionId?' · '+esc(c.sessions.find(s=>s.id===a.sessionId)?.title||''):''}</p></div>${isTeacher()?`<span class="badge blue">${subs.length} pengumpulan</span>`:`<span class="badge ${mine?'blue':'gold'}">${mine?'Sudah dikumpulkan':'Belum dikumpulkan'}</span>`}</div><p style="font-size:12px;line-height:1.7;margin:13px 0">${esc(a.instructions)}</p>${a.materialUrl?`<a class="btn btn-sm" href="${esc(a.materialUrl)}" target="_blank" rel="noopener noreferrer">Lampiran tugas ↗</a>`:''}${isStudent()?renderStudentSubmission(c,a,mine):renderTeacherSubmissions(c,a)}${isTeacher()?`<div class="form-actions"><button class="btn btn-sm btn-danger" data-action="delete-task" data-id="${a.id}" data-class-id="${c.id}">Hapus tugas</button></div>`:''}</section>`}).join('')||`<div class="panel empty"><div class="big">✎</div><b>Belum ada penugasan</b><p>${isTeacher()?'Klik “Buat tugas” untuk menambahkan tugas pertama.':'Guru belum menerbitkan penugasan.'}</p></div>`}</div>`}
function renderStudentSubmission(c,a,mine){if(!mine)return `<div class="divider"></div><form id="submit-task-form" data-class-id="${c.id}" data-task-id="${a.id}"><div class="form-grid"><div class="field full"><label>Jawaban teks</label><textarea name="text" placeholder="Tulis jawaban atau refleksi Anda…"></textarea></div><div class="field full"><label>Tautan jawaban (opsional)</label><input name="url" type="url" placeholder="https://…"></div><div class="field full"><label>Atau file kecil (maks. 1 MB untuk demo lokal)</label><input name="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.txt,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.mp4,.webm"></div></div><div class="form-actions"><button class="btn btn-primary" type="submit">Kumpulkan tugas</button></div></form>`;return `<div class="divider"></div><div class="notice ${isLate(mine,a)?'warn':'success'}"><b>${isLate(mine,a)?'Dikumpulkan terlambat':'Pengumpulan tersimpan'}</b> · ${fmt(mine.submittedAt,{dateStyle:'medium',timeStyle:'short'})}${isLate(mine,a)?` · Terlambat ${lateText(mine.submittedAt,a.deadline)}`:''}</div>${mine.file?`<p class="small"><a href="${mine.file.dataUrl}" download="${esc(mine.file.name)}">Unduh file: ${esc(mine.file.name)}</a></p>`:''}${mine.url?`<p class="small"><a href="${esc(mine.url)}" target="_blank" rel="noopener noreferrer">Buka tautan jawaban ↗</a></p>`:''}${mine.text?`<p class="small" style="white-space:pre-wrap;line-height:1.7">${esc(mine.text)}</p>`:''}<div class="row wrap"><span class="badge ${mine.score==null?'gold':'green'}">${mine.score==null?'Menunggu penilaian':'Nilai: '+mine.score+'/100'}</span>${mine.score!=null?`<span class="small muted">Dinilai ${fmt(mine.gradedAt)}</span>`:''}</div>${mine.feedback?`<div class="notice" style="margin-top:12px"><b>Umpan balik guru</b><p style="margin:5px 0 0">${esc(mine.feedback)}</p></div>`:''}`}
function renderTeacherSubmissions(c,a){return `<div class="divider"></div><h4 class="h3">Pengumpulan siswa (${a.submissions.length})</h4>${a.submissions.map(s=>{const u=getUser(s.userId);return `<div class="panel panel-pad" style="margin-top:12px;box-shadow:none;background:var(--bg)"><div class="row between wrap"><div class="row">${avatar(u,'sm')}<div><strong style="font-size:12px">${esc(u?.name||'Siswa')}</strong><div class="small muted">${fmt(s.submittedAt,{dateStyle:'medium',timeStyle:'short'})}</div></div></div><div class="row wrap"><span class="badge ${isLate(s,a)?'gold':'green'}">${isLate(s,a)?'Terlambat '+lateText(s.submittedAt,a.deadline):'Tepat waktu'}</span><span class="badge ${s.score==null?'gray':'blue'}">${s.score==null?'Belum dinilai':`Nilai ${s.score}/100`}</span></div></div>${s.text?`<p class="small" style="white-space:pre-wrap;line-height:1.7">${esc(s.text)}</p>`:''}${s.url?`<p class="small"><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">Buka tautan jawaban ↗</a></p>`:''}${s.file?`<p class="small"><a href="${s.file.dataUrl}" download="${esc(s.file.name)}">Unduh ${esc(s.file.name)}</a></p>`:''}<form id="grade-form" data-class-id="${c.id}" data-task-id="${a.id}" data-submission-id="${s.id}" style="margin-top:12px"><div class="form-grid"><div class="field"><label>Nilai (0–100)</label><input type="number" name="score" min="0" max="100" step="1" required value="${s.score??''}" placeholder="0–100"></div><div class="field"><label>Umpan balik</label><input name="feedback" maxlength="2000" value="${esc(s.feedback||'')}" placeholder="Catatan untuk siswa"></div></div><div class="form-actions"><button class="btn btn-primary btn-sm" type="submit">Simpan penilaian</button></div></form></div>`}).join('')||`<div class="empty" style="padding:20px">Belum ada siswa yang mengumpulkan tugas ini.</div>`}`}
function lateText(submitted,deadline){const ms=Math.max(0,new Date(submitted)-new Date(deadline));const days=Math.floor(ms/864e5),hours=Math.floor(ms%864e5/36e5),mins=Math.floor(ms%36e5/6e4);return `${days?days+' hari ':''}${hours} jam ${mins} menit`}
function speedForSubmission(sub,all){if(!sub||!all.length)return null;const sorted=[...all].sort((a,b)=>new Date(a.submittedAt)-new Date(b.submittedAt));let rank=1;for(const s of sorted){if(new Date(s.submittedAt)<new Date(sub.submittedAt))rank++;}if(all.length===1)return 100;return Math.max(10,Math.min(100,100-((rank-1)/(all.length-1))*90));}
function leaderboard(c){return c.members.map(m=>{const u=getUser(m.userId);const mine=c.assignments.flatMap(a=>(a.submissions||[]).filter(s=>s.userId===m.userId).map(s=>({a,s})));const graded=mine.filter(x=>x.s.score!=null);const scores=graded.map(x=>Number(x.s.score));const speeds=mine.map(({a,s})=>speedForSubmission(s,a.submissions.filter(x=>x.submittedAt))).filter(x=>x!=null);const avgScore=scores.length?scores.reduce((p,v)=>p+v,0)/scores.length:null;const avgSpeed=speeds.length?speeds.reduce((p,v)=>p+v,0)/speeds.length:null;const finalScore=(avgScore==null?0:avgScore)*.7+(avgSpeed==null?0:avgSpeed)*.3;return {user:u,avgScore,avgSpeed,finalScore,submitted:mine.length,graded:graded.length};}).sort((a,b)=>b.finalScore-a.finalScore||((a.user?.name||'').localeCompare(b.user?.name||'')));}
function renderParticipants(c){return `<div class="panel"><div class="panel-pad"><div class="section-head"><div><h2 class="h2">Peserta kelas</h2><p>${c.members.length} siswa terdaftar dalam kelas ini.</p></div>${isTeacher()?`<button class="btn btn-primary" data-action="modal-add-student" data-id="${c.id}">+ Tambahkan siswa</button>`:''}</div></div><div class="table-wrap"><table><thead><tr><th>Nama</th><th>Username</th><th>Instansi</th><th>Bergabung</th>${isTeacher()?'<th>Aksi</th>':''}</tr></thead><tbody>${c.members.map(m=>{const u=getUser(m.userId);return `<tr><td><div class="usercell">${avatar(u,'sm')}<div><strong>${esc(u?.name||'Akun tidak ditemukan')}</strong><span>${esc(u?.email||'')}</span></div></div></td><td>@${esc(u?.username||'')}</td><td>${esc(u?.institution||'—')}</td><td>${fmt(m.joinedAt)}</td>${isTeacher()?`<td><button class="btn btn-sm btn-danger" data-action="remove-student" data-class-id="${c.id}" data-id="${m.userId}">Keluarkan</button></td>`:''}</tr>`}).join('')||`<tr><td colspan="5">Belum ada peserta.</td></tr>`}</tbody></table></div></div>`}
function renderLeaderboard(c){const rows=leaderboard(c);return `<section class="panel panel-pad"><div class="row between wrap"><div><h2 class="h2">Leaderboard kelas</h2><p class="subhead">Skor akhir = 70% rata-rata nilai + 30% rata-rata poin kecepatan. Skala dibuat sama-sama 0–100.</p></div><span class="badge gold">♜ Papan peringkat</span></div><div class="notice" style="margin:16px 0">Poin kecepatan hanya dihitung untuk tugas yang benar-benar dikumpulkan: pengumpulan tercepat mendapat 100 poin, paling lambat 10 poin, dan nilai di antaranya proporsional. Jika hanya satu siswa mengumpulkan, nilainya 100. Nilai yang belum dinilai belum masuk ke rata-rata nilai.</div>${rows.length?rows.map((r,i)=>`<div class="list-line"><div class="rank-num ${i===0?'gold':i===1?'silver':i===2?'bronze':''}">${i+1}</div>${avatar(r.user,'sm')}<div class="grow"><strong>${esc(r.user?.name||'Siswa')}</strong><p>${r.graded} tugas dinilai · ${r.submitted} pengumpulan</p></div><div style="text-align:right"><strong style="font-size:14px">${r.finalScore.toFixed(1)}</strong><p class="small muted" style="margin:4px 0 0">Skor akhir</p></div></div>`).join(''):`<div class="empty">Belum ada peserta kelas.</div>`}</section>`}
function renderAttendance(){const list=isTeacher()?teacherClasses():studentClasses();if(selectedClassId&&list.some(c=>c.id===selectedClassId)){return renderAttendanceDetail();}return `<div class="page"><div class="section-head"><div><h1 class="content-title">Presensi</h1><p class="content-subtitle">${isTeacher()?'Pilih kelas untuk membuat pertemuan dan mengelola kehadiran.':'Laporan kehadiran pribadi untuk kelas yang Anda ikuti.'}</p></div></div><div class="grid grid-3">${list.map((c,i)=>`<article class="panel class-card"><div class="class-cover ${['','blue','gold'][i%3]}"></div><h3 class="h3">${esc(c.name)}</h3><p class="small muted">${c.meetings.length} pertemuan · ${isTeacher()?c.members.length+' peserta':'kode '+esc(c.code)}</p><button class="btn btn-primary" style="width:100%;margin-top:14px" data-action="open-attendance" data-id="${c.id}">${isTeacher()?'Kelola presensi':'Lihat laporan'} →</button></article>`).join('')||`<div class="panel empty" style="grid-column:1/-1"><div class="big">✓</div><b>Belum ada kelas</b><p>${isTeacher()?'Buat kelas terlebih dahulu.':'Gabung dengan kelas untuk melihat presensi Anda.'}</p><button class="btn btn-primary" data-route="classes">Buka Kelas</button></div>`}</div></div>`}
function renderAttendanceDetail(){const c=getClass();if(!classAllowed(c))return `<div class="page"><button class="btn" data-route="attendance">← Kembali</button>${denied()}</div>`;if(isAdmin())return denied();const meetings=[...c.meetings].sort((a,b)=>a.no-b.no);if(isStudent()){const records=meetings.map(m=>({m,r:m.records?.[currentUserId]}));const counts={};records.forEach(({r})=>{if(r?.status)counts[r.status]=(counts[r.status]||0)+1});return `<div class="page"><div class="row between wrap"><button class="btn" data-action="back-attendance">← Semua kelas</button><div class="row"><button class="btn" data-action="export-my-attendance" data-id="${c.id}">↓ CSV</button><button class="btn" data-action="export-my-attendance-xlsx" data-id="${c.id}">↓ Excel</button><button class="btn btn-primary" data-action="print">Cetak / PDF</button></div></div><div><h1 class="content-title">Presensi Saya</h1><p class="content-subtitle">${esc(c.name)} · hanya menampilkan kehadiran akun yang sedang masuk.</p></div><div class="grid grid-4">${['Hadir','Tidak Hadir','Izin','Sakit'].map((s,i)=>statCard(s,counts[s]||0,['✓','×','✉','✚'][i],['#ddf7eb','#ffe6ec','#e5efff','#fff0d3'][i])).join('')}</div><section class="panel"><div class="panel-pad"><div class="section-head"><div><h2 class="h2">Riwayat kehadiran</h2><p>${records.length} pertemuan tersedia. Status tidak dapat diubah oleh siswa.</p></div></div></div><div class="table-wrap"><table><thead><tr><th>No.</th><th>Nama pertemuan</th><th>Tanggal</th><th>Waktu</th><th>Status</th><th>Terakhir diperbarui</th></tr></thead><tbody>${records.map(({m,r})=>`<tr><td>${m.no}</td><td>${esc(m.title)}</td><td>${fmt(m.date)}</td><td>${esc(m.time||'—')}</td><td><span class="badge ${r?.status==='Hadir'?'green':r?.status==='Tidak Hadir'?'red':r?.status==='Izin'?'blue':r?.status==='Sakit'?'gold':'gray'}">${esc(r?.status||'Belum diisi')}</span></td><td>${fmt(r?.updatedAt,{dateStyle:'short',timeStyle:'short'})}</td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">Belum ada pertemuan presensi.</div></td></tr>'}</tbody></table></div><div class="panel-pad small muted">Rekap: ${records.length} pertemuan · ${Object.values(counts).reduce((n,v)=>n+v,0)} status tercatat.</div></section></div>`}
 return `<div class="page"><div class="row between wrap"><button class="btn" data-action="back-attendance">← Semua kelas</button><div class="row"><button class="btn" data-action="export-class-attendance" data-id="${c.id}">↓ CSV</button><button class="btn" data-action="export-class-attendance-xlsx" data-id="${c.id}">↓ Excel</button><button class="btn btn-primary" data-action="print">Cetak / PDF</button></div></div><div class="section-head"><div><h1 class="content-title">Presensi: ${esc(c.name)}</h1><p class="content-subtitle">Buat pertemuan dan perbarui status setiap siswa.</p></div><button class="btn btn-primary" data-action="modal-create-meeting" data-id="${c.id}">+ Tambah Pertemuan</button></div><section class="panel panel-pad"><div class="section-head"><div><h2 class="h2">Daftar pertemuan</h2><p>${meetings.length} pertemuan dibuat · dapat ditambah sesuai kebutuhan.</p></div></div><div class="stack">${meetings.map(m=>`<details class="panel" style="box-shadow:none" ${meetings.length<3?'open':''}><summary style="padding:14px;cursor:pointer;display:flex;gap:12px;align-items:center;justify-content:space-between;list-style-position:inside"><span><span class="badge">Pertemuan ${m.no}</span> <b style="font-size:12px">${esc(m.title)}</b><span class="small muted"> · ${fmt(m.date)} · ${esc(m.time||'')}</span></span><span class="badge blue">${Object.keys(m.records||{}).length}/${c.members.length} dicatat</span></summary><div style="padding:0 14px 14px"><p class="small muted">${esc(m.material||'Tidak ada keterangan materi.')}</p><div class="table-wrap"><table><thead><tr><th>Nama siswa</th><th>Status kehadiran</th><th>Update</th></tr></thead><tbody>${c.members.map(mem=>{const st=m.records?.[mem.userId];return `<tr><td>${esc(getUser(mem.userId)?.name||'Siswa')}</td><td><select class="inline-input attendance-select" data-meeting-id="${m.id}" data-user-id="${mem.userId}" data-class-id="${c.id}" style="max-width:180px"><option value="" ${!st?'selected':''}>Belum diisi</option>${['Hadir','Tidak Hadir','Izin','Sakit'].map(x=>`<option ${st?.status===x?'selected':''}>${x}</option>`).join('')}</select></td><td class="small muted">${fmt(st?.updatedAt,{dateStyle:'short',timeStyle:'short'})}</td></tr>`}).join('')}</tbody></table></div><div class="form-actions"><button class="btn btn-primary btn-sm" data-action="save-attendance" data-id="${m.id}" data-class-id="${c.id}">Simpan perubahan presensi</button></div></div></details>`).join('')||`<div class="empty"><div class="big">✓</div><b>Belum ada pertemuan</b><p>Buat pertemuan pertama untuk mulai mencatat kehadiran.</p></div>`}</div></section></div>`}
function renderSettings(){const u=getUser();const p=u.profile||{};const isS=u.baseRole==='siswa';return `<div class="page"><div class="section-head"><div><h1 class="content-title">Pengaturan Profil</h1><p class="content-subtitle">Perbarui data pribadi akun yang sedang digunakan.</p></div><span class="badge blue">${roleLabel(u.baseRole)}</span></div>${u.mustChangePassword?`<div class="notice warn"><b>Password perlu diganti.</b> Akun ini ditandai wajib mengubah password. Perubahan bisa diselesaikan di bawah; keluar dari sesi tetap diperbolehkan.</div>`:''}<div class="grid grid-2"><section class="panel panel-pad"><div class="section-head"><div><h2 class="h2">Informasi profil</h2><p>Perubahan akan langsung diperbarui di demo browser ini.</p></div></div><div class="row" style="margin-bottom:22px">${avatar(u,'lg')}<div><strong>${esc(u.name)}</strong><div class="small muted" style="margin-top:5px">@${esc(u.username)}</div><div class="small muted" style="margin-top:4px">Bergabung ${fmt(u.createdAt)}</div></div></div><form id="profile-form"><div class="form-grid"><div class="field full"><label>Nama lengkap</label><input name="name" required maxlength="100" value="${esc(u.name)}"></div><div class="field"><label>Username</label><input name="username" required minlength="3" maxlength="30" pattern="[A-Za-z0-9._-]+" value="${esc(u.username)}"></div><div class="field"><label>Email (tidak dapat diubah di demo)</label><input value="${esc(u.email)}" disabled></div><div class="field full"><label>Asal instansi / sekolah</label><input name="institution" maxlength="150" value="${esc(u.institution||'')}"></div>${isS?`<div class="field"><label>Nomor induk siswa (NIS)</label><input name="nis" maxlength="50" value="${esc(p.nis||'')}"></div><div class="field"><label>Angkatan</label><input name="cohort" maxlength="20" value="${esc(p.cohort||'')}"></div>`:u.baseRole==='guru'?`<div class="field full"><label>NIP</label><input name="nip" maxlength="50" value="${esc(p.nip||'')}"></div>`:''}<div class="field full"><label>Deskripsi / biodata</label><textarea name="bio" maxlength="2000" placeholder="Ceritakan secara singkat…">${esc(p.bio||'')}</textarea></div><div class="field full"><label>Foto profil (maks. 400 KB)</label><input name="avatar" type="file" accept="image/png,image/jpeg,image/webp"><span class="small muted">File gambar disimpan pada browser demo. Gunakan gambar dengan ukuran kecil.</span></div></div><div class="form-actions"><button class="btn btn-primary" type="submit">Simpan profil</button></div></form></section><section class="panel panel-pad"><div class="section-head"><div><h2 class="h2">Keamanan akun</h2><p>Ganti password demo kapan saja.</p></div><span class="badge gold">Lokal</span></div><form id="password-form"><div class="field"><label>Password saat ini</label><input name="current" type="password" required autocomplete="current-password"></div><div class="field"><label>Password baru</label><input name="password" type="password" minlength="8" required autocomplete="new-password"><span class="small muted">Minimal 8 karakter.</span></div><div class="field"><label>Ulangi password baru</label><input name="password2" type="password" minlength="8" required autocomplete="new-password"></div><div class="form-actions"><button class="btn btn-primary" type="submit">Ubah password</button></div></form><div class="divider"></div><h3 class="h3">Preferensi tampilan</h3><p class="small muted">Pengaturan tema hanya memengaruhi tampilan pada perangkat/browser ini.</p><button class="btn" data-action="toggle-theme">${document.body.classList.contains('dark')?'☼ Gunakan mode terang':'☾ Gunakan mode gelap'}</button><div class="divider"></div><h3 class="h3">Status koneksi layanan</h3><div class="list-line"><span class="badge gold">Belum terhubung</span><div class="grow"><strong>Database cloud</strong><p>Mode offline lokal.</p></div></div><div class="list-line"><span class="badge gold">Belum terhubung</span><div class="grow"><strong>Email pemulihan</strong><p>Perlu SMTP / Resend.</p></div></div><div class="list-line"><span class="badge gold">Belum terhubung</span><div class="grow"><strong>Asisten AI</strong><p>Perlu API key sisi server.</p></div></div></section></div></div>`}
function userMessages(u=currentUserId){let thread=db.messages.find(m=>m.userId===u);if(!thread){thread={id:uid(),userId:u,messages:[]};db.messages.push(thread);}return thread}
function renderHelpdesk(){if(isAdmin()){const threads=db.messages.filter(t=>t.messages?.length).sort((a,b)=>new Date(b.messages[b.messages.length-1].createdAt)-new Date(a.messages[a.messages.length-1].createdAt));return `<div class="page"><div class="section-head"><div><h1 class="content-title">Kotak Pesan Admin</h1><p class="content-subtitle">Percakapan pengguna demo tersimpan lokal. Notifikasi email tidak dikirim.</p></div></div><div class="notice warn">Email belum dikonfigurasi. Saat ini pesan hanya disimpan di browser demo dan tidak diteruskan kepada admin melalui email.</div><div class="grid grid-2"><section class="panel panel-pad"><h2 class="h2">Percakapan</h2><p class="subhead">Pilih percakapan untuk melihat pesan dan membalas.</p><div style="margin-top:14px">${threads.map(t=>{const u=getUser(t.userId),last=t.messages.at(-1);return `<button class="list-line" data-action="open-thread" data-id="${t.userId}" style="width:100%;text-align:left;background:transparent;border:0;cursor:pointer">${avatar(u,'sm')}<div class="grow"><strong>${esc(u?.name||t.guestName||'Pengguna')}</strong><p>${esc(last?.text?.slice(0,80)||'Belum ada pesan')}</p></div><span class="small muted">${fmt(last?.createdAt,{dateStyle:'short'})}</span></button>`}).join('')||`<div class="empty">Belum ada pesan dari pengguna.</div>`}</div></section><section class="panel panel-pad">${renderAdminThread()}</section></div></div>`;}const thread=db.messages.find(m=>m.userId===currentUserId);return `<div class="page"><div class="section-head"><div><h1 class="content-title">Hubungi Admin</h1><p class="content-subtitle">Sampaikan kendala akun atau pertanyaan terkait penggunaan GoLearnMS.</p></div></div><div class="notice warn">Mode demo lokal: pesan tersimpan di browser ini, tetapi tidak ada email yang dikirim. Fitur notifikasi email aktif setelah layanan email dikonfigurasi.</div><section class="panel panel-pad"><div class="row" style="align-items:flex-start"><div class="activity-icon">✉</div><div><h2 class="h2">Percakapan bantuan</h2><p class="subhead">Sampaikan masalah dengan jelas. Hindari mengirimkan password atau kode rahasia.</p></div></div><div class="divider"></div><div class="chat-messages">${(thread?.messages||[]).map(m=>`<div style="display:flex;justify-content:${m.from==='user'?'flex-end':'flex-start'};margin:12px 0"><div style="max-width:85%;padding:12px 14px;border-radius:13px;background:${m.from==='user'?'#eee8ff':'var(--bg)'};font-size:12px;line-height:1.7;color:${m.from==='user'?'#49368e':'var(--text)'}"><div style="font-size:9px;font-weight:800;margin-bottom:5px">${m.from==='user'?'Anda':'Admin'} · ${fmt(m.createdAt,{dateStyle:'short',timeStyle:'short'})}</div>${esc(m.text)}</div></div>`).join('')||`<div class="empty" style="padding:22px"><div class="big">✉</div><b>Belum ada percakapan</b><p>Tuliskan pesan pertama Anda melalui formulir di bawah.</p></div>`}</div><form id="message-form"><div class="field"><label>Pesan Anda</label><textarea name="text" required maxlength="3000" placeholder="Jelaskan kendala atau pertanyaan Anda…"></textarea></div><div class="form-actions"><button class="btn btn-primary" type="submit">Simpan pesan</button></div></form></section></div>`}

async function loginUser(username,password,role,remember=true){const un=norm(username),u=db.users.find(x=>norm(x.username)===un||norm(x.email)===un);if(!u){notify('Username, password, atau kategori akun tidak sesuai.','error');return false;}if(u.blocked){notify('Akun ini diblokir. Hubungi admin untuk meminta pemulihan akses.','error');return false;}if(!u.roles.includes(role)||(role==='guru'&&u.baseRole!=='guru')||(role==='siswa'&&u.baseRole!=='siswa')){notify('Akun tidak memiliki akses untuk kategori yang dipilih.','error');return false;}const h=await hashPassword(password,u.passwordSalt);if(h!==u.passwordHash){notify('Username, password, atau kategori akun tidak sesuai.','error');return false;}currentUserId=u.id;activeRole=role;route='dashboard';selectedClassId=null;touchPresence(true);if(remember)localStorage.setItem(SESSION,u.id);else localStorage.removeItem(SESSION);persist();render();notify(`Selamat datang, ${u.name.split(' ')[0]}!`);return true;}

function colName(n){let s='';while(n>0){const r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26);}return s}
function crc32(bytes){let c=-1;for(let i=0;i<bytes.length;i++){c^=bytes[i];for(let j=0;j<8;j++)c=(c>>>1)^((c&1)?0xedb88320:0);}return (c^(-1))>>>0}

function formatBytes(b){if(!b)return '0 B';const units=['B','KB','MB'];const i=Math.min(units.length-1,Math.floor(Math.log(b)/Math.log(1024)));return `${(b/Math.pow(1024,i)).toFixed(i?1:0)} ${units[i]}`}
function fileAsData(file,max=1024*1024){return new Promise((resolve,reject)=>{if(!file){resolve(null);return;}if(file.size>max){reject(new Error(`Ukuran file ${formatBytes(file.size)} melebihi batas ${formatBytes(max)} pada demo lokal.`));return;}const allowed=/^(image\/(png|jpeg|webp)|application\/pdf|text\/plain|video\/(mp4|webm)|application\/(msword|vnd\.openxmlformats-officedocument\.wordprocessingml\.document|vnd\.ms-excel|vnd\.openxmlformats-officedocument\.spreadsheetml\.sheet|vnd\.ms-powerpoint|vnd\.openxmlformats-officedocument\.presentationml\.presentation))$/i;if(!allowed.test(file.type)&&!(/\.(pdf|png|jpg|jpeg|webp|txt|doc|docx|xls|xlsx|ppt|pptx|mp4|webm)$/i.test(file.name))){reject(new Error('Tipe file tidak didukung. Gunakan PDF, dokumen Office, gambar, video, atau teks.'));return;}const reader=new FileReader();reader.onload=()=>resolve({name:file.name,type:file.type,size:file.size,dataUrl:reader.result});reader.onerror=()=>reject(new Error('File tidak dapat dibaca.'));reader.readAsDataURL(file);});}
function secureUrl(s){if(!s)return '';try{const u=new URL(s);if(!['http:','https:'].includes(u.protocol))return null;return u.href;}catch{return null}}
function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++;}else if(c==='"')quoted=false;else cell+=c;}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell='';}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell='';}else cell+=c;}if(cell.length||row.length){row.push(cell.replace(/\r$/,''));rows.push(row);}return rows.filter(r=>r.some(x=>x.trim()));}
async function importUsersFile(file){try{const txt=await file.text();const rows=parseCSV(txt);if(rows.length<2)throw new Error('CSV harus memiliki header dan minimal satu baris data.');const header=rows[0].map(norm);const idx={name:header.findIndex(x=>['nama','name','nama lengkap'].includes(x)),username:header.findIndex(x=>x==='username'),email:header.findIndex(x=>x==='email'),role:header.findIndex(x=>['role','peran'].includes(x)),institution:header.findIndex(x=>['instansi','institution','asal instansi'].includes(x)),password:header.findIndex(x=>['password','kata sandi'].includes(x))};if(Object.values(idx).some(i=>i<0))throw new Error('Header wajib: nama, username, email, role, instansi, password. Password dipakai untuk membuat hash lokal dan tidak disimpan sebagai teks biasa.');const parsed=[],errors=[];for(let i=1;i<rows.length;i++){const r=rows[i];const o=Object.fromEntries(Object.entries(idx).map(([k,j])=>[k,String(r[j]||'').trim()]));o.role=norm(o.role);if(!o.name||!o.username||!/^\S+@\S+\.\S+$/.test(o.email)||!['guru','siswa'].includes(o.role)||!o.institution||o.password.length<8){errors.push(`Baris ${i+1}: data tidak lengkap, role tidak valid, email salah, atau password kurang dari 8 karakter.`);continue;}if(db.users.some(u=>norm(u.username)===norm(o.username)||norm(u.email)===norm(o.email))||parsed.some(u=>norm(u.username)===norm(o.username)||norm(u.email)===norm(o.email))){errors.push(`Baris ${i+1}: username atau email sudah digunakan.`);continue;}parsed.push(o);}if(!parsed.length)throw new Error('Tidak ada baris valid untuk diimpor. '+errors.slice(0,3).join(' '));showModal('Pratinjau impor pengguna',`<div class="notice ${errors.length?'warn':'success'}">${parsed.length} akun valid · ${errors.length} baris ditolak.</div>${errors.length?`<ul class="small" style="line-height:1.7">${errors.slice(0,8).map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`:''}<div class="table-wrap" style="margin-top:15px"><table><thead><tr><th>Nama</th><th>Username</th><th>Email</th><th>Peran</th></tr></thead><tbody>${parsed.slice(0,12).map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${esc(u.email)}</td><td>${roleLabel(u.role)}</td></tr>`).join('')}</tbody></table></div><p class="small muted">Password akan langsung di-hash oleh browser demo dan tidak diekspor. Untuk produksi gunakan proses undangan/password reset melalui backend.</p><div class="form-actions"><button class="btn" data-action="close-modal">Batal</button><button class="btn btn-primary" data-action="confirm-import" data-payload="${encodeURIComponent(JSON.stringify(parsed))}">Impor ${parsed.length} akun</button></div>`);}catch(e){notify(e.message||'File CSV gagal diproses.','error');}}

 case'contact-login':showModal('Hubungi admin sebelum masuk',`<div class="notice warn" style="margin-bottom:14px">Pesan hanya tersimpan di browser demo dan tidak diteruskan lewat email. Jangan kirim password atau informasi rahasia.</div><form id="guest-contact-form"><div class="form-grid"><div class="field"><label>Nama</label><input name="name" required maxlength="100"></div><div class="field"><label>Email untuk dihubungi</label><input name="email" required type="email"></div><div class="field full"><label>Pesan</label><textarea name="text" required maxlength="3000"></textarea></div></div><div class="form-actions"><button class="btn" type="button" data-action="close-modal">Batal</button><button class="btn btn-primary" type="submit">Simpan pesan</button></div></form>`);return;
 case'close-modal':closeModal();return;case'backdrop-close':if(ev.target===el)closeModal();return;
 case'logout':{const u=getUser();if(u?.mustChangePassword&&!confirm('Password akun ini wajib diganti. Keluar sekarang? Anda tetap dapat melanjutkan perubahan password setelah masuk kembali.'))return;if(!confirm('Yakin ingin keluar dari GoLearnMS?'))return;localStorage.removeItem(SESSION);currentUserId=null;activeRole=null;route='dashboard';selectedClassId=null;render();notify('Anda telah keluar.');return;}
 case'toggle-theme':document.body.classList.toggle('dark');localStorage.setItem('golearnms_theme',document.body.classList.contains('dark')?'dark':'light');if(currentUserId)render();return;
 case'toggle-sidebar':$('#sidebar')?.classList.toggle('open');return;
 case'modal-create-class':if(isTeacher())modalCreateClass();else notify('Fitur buat kelas hanya untuk guru.','error');return;
 case'modal-join-class':if(isStudent()){$('#join-class-form input[name="code"]')?.focus();$('#join-class-form')?.scrollIntoView({behavior:'smooth',block:'center'});}return;
 case'modal-create-session':if(isTeacher())modalSession(id||selectedClassId);return;
 case'modal-create-task':if(isTeacher())modalTask(id||selectedClassId);return;
 case'modal-create-meeting':if(isTeacher())modalMeeting(id||selectedClassId);return;
 case'modal-add-student':if(isTeacher())modalAddStudent(id||selectedClassId);return;
 case'modal-add-user':if(canSuper())modalAddUser();else notify('Hanya superadmin yang dapat membuat akun dari panel ini.','error');return;
 case'open-class':selectedClassId=id;classTab=el.dataset.tab||'overview';route='class-detail';recordRouteVisit(route);render();return;
 case'edit-class':{const c=getClass(id);if(!c||c.teacherId!==currentUserId||!isTeacher()){notify('Akses ditolak.','error');return;}modalCreateClass(c);return;}
 case'class-tab':classTab=el.dataset.tab;route='class-detail';render();return;
 case'copy-code':try{await navigator.clipboard.writeText(el.dataset.code||'');notify('Kode kelas disalin.');}catch{showModal('Kode masuk kelas',`<p class="small muted">Salin kode berikut untuk dibagikan kepada siswa.</p><input class="inline-input" value="${esc(el.dataset.code||'')}" readonly onclick="this.select()"><div class="form-actions"><button class="btn btn-primary" data-action="close-modal">Selesai</button></div>`);}return;
 case'join-open-class':{const c=getClass(id);if(c){const inp=$('#join-class-form input[name="code"]');if(inp)inp.value=c.code;$('#join-class-form')?.scrollIntoView({behavior:'smooth',block:'center'});notify('Kode kelas dimasukkan. Tekan tombol Gabung kelas untuk memvalidasi kode.');}return;}
 case'use-class-code':{const inp=$('#join-class-form input[name="code"]');if(inp)inp.value=el.dataset.code||'';$('#join-class-form')?.scrollIntoView({behavior:'smooth',block:'center'});return;}
 case'delete-session':{const c=getClass(el.dataset.classId);if(!isTeacher()||c?.teacherId!==currentUserId)return notify('Akses ditolak.','error');if(!confirm('Hapus sesi ini beserta materi yang terkait?'))return;c.sessions=c.sessions.filter(s=>s.id!==id);persist();render();notify('Sesi dihapus.');return;}
 case'delete-material':{const c=getClass(el.dataset.classId),s=c?.sessions.find(x=>x.id===el.dataset.sessionId);if(!isTeacher()||c?.teacherId!==currentUserId||!s)return notify('Akses ditolak.','error');if(!confirm('Hapus materi ini?'))return;s.materials=s.materials.filter(m=>m.id!==id);persist();render();notify('Materi dihapus.');return;}
 case'delete-task':{const c=getClass(el.dataset.classId);if(!isTeacher()||c?.teacherId!==currentUserId)return notify('Akses ditolak.','error');if(!confirm('Hapus tugas dan pengumpulan terkait?'))return;c.assignments=c.assignments.filter(a=>a.id!==id);persist();render();notify('Tugas dihapus.');return;}
 case'remove-student':{const c=getClass(el.dataset.classId);if(!isTeacher()||c?.teacherId!==currentUserId)return notify('Akses ditolak.','error');if(!confirm('Keluarkan siswa dari kelas ini? Catatan tugas dan presensi yang ada tetap tersimpan.'))return;c.members=c.members.filter(m=>m.userId!==id);persist();render();notify('Siswa dikeluarkan dari daftar peserta.');return;}
 case'open-attendance':selectedClassId=id;route='attendance-detail';recordRouteVisit(route);render();return;
 case'back-attendance':selectedClassId=null;route='attendance';render();return;
 case'save-attendance':saveAttendanceFromUI(el.dataset.classId,id);return;
 case'view-user':showUser(id);return;
 case'toggle-block':toggleBlock(id);return;
 case'toggle-admin':toggleAdmin(id);return;
 case'export-users':exportUsers();return;
 case'export-users-xlsx':exportUsersXLSX();return;
 case'export-report-xlsx':exportReportXLSX();return;
 case'export-maintenance-xlsx':exportMaintenanceXLSX();return;
 case'export-class-attendance-xlsx':{const c=getClass(id);if(c)exportAttendanceXLSXFor(c,false);return;}
 case'export-my-attendance-xlsx':{const c=getClass(id);if(c)exportAttendanceXLSXFor(c,true);return;}
 case'export-report':exportReport();return;
 case'export-maintenance':exportMaintenance();return;
 case'export-all-attendance':exportAllAttendance();return;
 case'export-all-attendance-xlsx':{const rows=[];db.classes.forEach(c=>exportDataForClass(c,rows));exportXLSX('golearnms-presensi-seluruh-kelas.xlsx','Presensi',['Kelas','No Pertemuan','Pertemuan','Tanggal','Waktu','Nama Siswa','Username','Status','Terakhir Diubah'],rows);return;}
 case'export-class-attendance':{const c=getClass(id);if(c)exportAttendanceFor(c,false);return;}
 case'export-my-attendance':{const c=getClass(id);if(c)exportAttendanceFor(c,true);return;}
 case'print':window.print();return;
 case'log-status':{if(!isAdmin())return notify('Akses ditolak.','error');const l=db.logs.find(x=>x.id===id);if(l){l.status=el.dataset.status;persist();render();notify('Status log diperbarui.');}return;}
 case'view-admin-class':selectedClassId=id;classTab='overview';route='class-detail';recordRouteVisit(route);render();return;
 case'open-thread':selectedThreadUser=id;render();return;
 case'confirm-import':await processImport(el.dataset.payload);return;
 default:break;
 }}catch(err){console.error(err);notify(err.message||'Operasi gagal.','error');}return;}
 if(routeEl){const r=routeEl.dataset.route;if(!r)return;if(routeEl.dataset.id){if(r==='attendance')selectedClassId=routeEl.dataset.id;else if(r==='classes')selectedClassId=null;}if(r==='classes')selectedClassId=null;if(r==='attendance'&&!isStudent()&&!isTeacher()){notify('Akses ditolak.','error');return;}route=r;if(r==='dashboard')selectedThreadUser=null;recordRouteVisit(r);render();$('#sidebar')?.classList.remove('open');return;}
});
document.addEventListener('change',function(ev){const el=ev.target;if(el.id==='role-switch'){const u=getUser();if(!u?.roles.includes(el.value))return;activeRole=el.value;route='dashboard';selectedClassId=null;render();return;}if(el.id==='report-period'){reportPeriod=el.value;render();return;}if(el.id==='report-role'){reportRole=el.value;render();return;}if(el.id==='status-filter'){statusFilter=el.value;render();return;}if(el.id==='users-import'&&el.files?.[0]){importUsersFile(el.files[0]);el.value='';return;}});
document.addEventListener('input',function(ev){if(ev.target.id==='user-search'){searchUsers=ev.target.value;const pos=ev.target.selectionStart;render();const inp=$('#user-search');if(inp){inp.focus();inp.setSelectionRange(pos,pos);}return;}});
window.addEventListener('storage',function(ev){if(ev.key===STORE){try{db=JSON.parse(ev.newValue)||db;render();}catch{}}});
// Heartbeat lokal: memperbarui aktivitas hanya untuk sesi pengguna yang sedang aktif.
setInterval(()=>{if(currentUserId&&db){const u=getUser();if(u&&!u.blocked){u.lastSeen=now();persist();}}},45000);
window.addEventListener('beforeunload',()=>{if(currentUserId){const u=getUser();if(u)u.lastSeen=new Date(Date.now()-LAST_ACTIVE-1000).toISOString();persist();}});
bindHelpers();init().catch(err=>{console.error(err);$('#app').innerHTML=`<div class="loading"><div><h2>GoLearnMS tidak dapat dimuat</h2><p>${esc(err.message||'Kesalahan inisialisasi.')}</p><button class="btn btn-primary" onclick="location.reload()">Muat ulang</button></div></div>`;});
})();
</script>
</body>
</html>
